<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title description">
<title id="title">The website design cycle</title>
<desc id="description">Discover, design, refine, and launch form a clockwise cycle. Feedback informs each stage and future improvements.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#35634e" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
<circle cx="350" cy="350" r="205" fill="none" stroke="#c9d2c8" stroke-width="2"/>
<g fill="none" stroke="#35634e" stroke-width="3" marker-end="url(#arrow)">
<path d="M403 152 A205 205 0 0 1 548 297"/>
<path d="M548 403 A205 205 0 0 1 403 548"/>
<path d="M297 548 A205 205 0 0 1 152 403"/>
<path d="M152 297 A205 205 0 0 1 297 152"/>
</g>
<g fill="#123f32"><circle cx="350" cy="145" r="8"/><circle cx="555" cy="350" r="8"/><circle cx="350" cy="555" r="8"/><circle cx="145" cy="350" r="8"/></g>
<g fill="#123f32" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle">
<text x="350" y="102">Discover</text><text x="627" y="359">Design</text><text x="350" y="609">Refine</text><text x="73" y="359">Launch</text>
</g>
<text x="350" y="341" fill="#123f32" font-family="Georgia, serif" font-size="36" text-anchor="middle">Your website</text>
<text x="350" y="380" fill="#536052" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle">Feedback at every stage</text>
</svg>